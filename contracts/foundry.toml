[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
extra_output = ["storageLayout"]
build_info = true
ast = true
[profile.default.fuzz]
runs = 256
[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[lint]
# Deliberate timestamp comparisons implement oracle freshness, market expiry and transaction deadlines.
# They do not provide randomness or exact-time execution guarantees; boundary tests cover each.
exclude_lints = ["block-timestamp"]
ignore = ["test/**"]
